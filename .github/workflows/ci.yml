name: FilePad CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  django-tests:
    name: Django Checks and Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: filepad_ci
          POSTGRES_USER: filepad_ci
          POSTGRES_PASSWORD: ci-test-password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U filepad_ci -d filepad_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-dummy-secret-key
      VAULT_LOOKUP_SECRET: ci-only-dummy-vault-secret-0123456789
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      USE_S3: "False"

      DB_NAME: filepad_ci
      DB_USER: filepad_ci
      DB_PASSWORD: ci-test-password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_SSLMODE: disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Apply database migrations
        run: python manage.py migrate --noinput

      - name: Run automated tests
        run: python manage.py test

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: django-tests

    env:
      DJANGO_SECRET_KEY: ci-only-dummy-secret-key
      VAULT_LOOKUP_SECRET: ci-only-dummy-vault-secret-0123456789
      USE_S3: "False"
      DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FilePad image
        run: docker build -t filepad-web:ci .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: filepad-web:ci
          scan-type: image
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
