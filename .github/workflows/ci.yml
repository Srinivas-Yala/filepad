name: FilePad CI and CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  django-tests:
    name: Django Checks and Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: filepad_ci
          POSTGRES_USER: filepad_ci
          POSTGRES_PASSWORD: ci-test-password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U filepad_ci -d filepad_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-dummy-secret-key
      VAULT_LOOKUP_SECRET: ci-only-dummy-vault-secret-0123456789
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      USE_S3: "False"

      DB_NAME: filepad_ci
      DB_USER: filepad_ci
      DB_PASSWORD: ci-test-password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_SSLMODE: disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Apply database migrations
        run: python manage.py migrate --noinput

      - name: Run automated tests
        run: python manage.py test

  docker-build:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: django-tests

    permissions:
      contents: read
      packages: write

    env:
      DJANGO_SECRET_KEY: ci-only-dummy-secret-key
      VAULT_LOOKUP_SECRET: ci-only-dummy-vault-secret-0123456789
      USE_S3: "False"
      DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/srinivas-yala/filepad
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish FilePad image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-production:
    name: Deploy FilePad to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: filepad-production
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy exact commit to EC2 through SSM
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Invalid image SHA"
            exit 1
          fi

          REMOTE_SCRIPT=$(cat <<REMOTE
          set -eu
          cd /home/ubuntu/filepad

          OLD_TAG=\$(grep -m1 '^FILEPAD_IMAGE_TAG=' .env | cut -d= -f2-)
          NEW_TAG='$IMAGE_TAG'

          case "\$OLD_TAG" in
            *[!a-f0-9]*|"")
              echo "Existing image tag is invalid. Aborting."
              exit 1
              ;;
          esac

          if [ "\${#OLD_TAG}" -ne 40 ]; then
            echo "Existing image tag has invalid length."
            exit 1
          fi

          echo "Previous release: \$OLD_TAG"
          echo "New release: \$NEW_TAG"

          rollback() {
            echo "Deployment failed. Restoring previous release."

            if ! sed -i "s/^FILEPAD_IMAGE_TAG=.*/FILEPAD_IMAGE_TAG=\$OLD_TAG/" .env; then
              echo "ERROR: Could not restore previous image tag."
              return 1
            fi

            if ! sudo docker compose up -d --no-build --pull never web; then
              echo "ERROR: Could not restart previous release."
              return 1
            fi

            ROLLBACK_HEALTHY=0

            for j in \$(seq 1 36); do
              ROLLBACK_STATUS=\$(sudo docker inspect --format '{{.State.Health.Status}}' filepad-web 2>/dev/null || echo missing)
              echo "Rollback container health: \$ROLLBACK_STATUS"

              if [ "\$ROLLBACK_STATUS" = healthy ]; then
                ROLLBACK_HEALTHY=1
                break
              fi

              if [ "\$ROLLBACK_STATUS" = unhealthy ] || [ "\$ROLLBACK_STATUS" = missing ]; then
                break
              fi

              sleep 5
            done

            if [ "\$ROLLBACK_HEALTHY" -ne 1 ]; then
              echo "ERROR: Previous container did not become healthy."
              return 1
            fi

            if ! curl --fail --silent --show-error --max-time 15 https://filepad.online/ -o /dev/null; then
              echo "ERROR: Public HTTPS check failed after rollback."
              return 1
            fi

            echo "Previous release restored and verified."
          }

          sed -i "s/^FILEPAD_IMAGE_TAG=.*/FILEPAD_IMAGE_TAG=\$NEW_TAG/" .env

          if ! sudo docker compose pull web; then
            rollback
            exit 1
          fi

          if ! sudo docker compose up -d --no-build --pull never web; then
            rollback
            exit 1
          fi

          HEALTHY=0

          for i in \$(seq 1 36); do
            STATUS=\$(sudo docker inspect --format '{{.State.Health.Status}}' filepad-web 2>/dev/null || echo missing)
            echo "Container health: \$STATUS"

            if [ "\$STATUS" = healthy ]; then
              HEALTHY=1
              break
            fi

            if [ "\$STATUS" = unhealthy ] || [ "\$STATUS" = missing ]; then
              break
            fi

            sleep 5
          done

          if [ "\$HEALTHY" -ne 1 ]; then
            rollback
            exit 1
          fi

          if ! curl --fail --silent --show-error --max-time 15 https://filepad.online/ -o /dev/null; then
            rollback
            exit 1
          fi

          echo "Deployment successful."
          REMOTE
          )

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "i-05bbad76fed7f25df" \
            --parameters "$(jq -n --arg script "$REMOTE_SCRIPT" '{commands: [$script]}')" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 80); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-05bbad76fed7f25df" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Production deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-05bbad76fed7f25df" \
                  --query 'StandardErrorContent' \
                  --output text || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM deployment."
          exit 1
